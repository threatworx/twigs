# Implementation Class UID roots (A-ASSOCIATE user information item 0x52).
impl_uid_roots:
  1.2.840.113619:        {vendor: GE Healthcare}
  1.3.12.2.1107.5:       {vendor: Siemens Healthineers}
  1.3.46.670589:         {vendor: Philips}
  1.2.392.200036.9116:   {vendor: Canon Medical}
  1.2.392.200036.9125:   {vendor: Fujifilm}
  1.2.124.113532:        {vendor: Agfa}
  1.2.840.113681:        {vendor: Hologic}
  1.2.276.0.7230010.3:   {software: dcmtk}
  1.2.826.0.1.3680043.9.3811: {software: pynetdicom}
  1.2.40.0.13.1:         {software: dcm4che}

# Implementation Version Name (item 0x55) -> software product and version.
impl_version_names:
  - {pattern: '^OFFIS_DCMTK_([0-9])([0-9])([0-9])', software: dcmtk, version: '\1.\2.\3'}
  - {pattern: '^PYNETDICOM_([0-9]+)', software: pynetdicom, version: '\1'}
  - {pattern: '^dcm4che-?([0-9][\w.]*)', software: dcm4che, version: '\1'}
