# Medical device signatures for twigs passive discovery.
#
# Each rule identifies a vendor / model / device class from passively
# observed identity strings. A rule matches when ANY of its "match" fields
# matches (case-insensitive regular expression). Every distinct field that
# matches adds that field's weight to the device's confidence score.
# See twigs/passive/README.md for the list of fields and their weights.
#
# "firmware" (optional) is a list of regexes with one capture group, tried
# against every string that matched the rule.

category: medical

rules:
  # ---------------------------------------------------------------- infusion
  - id: bd-alaris
    vendor: BD
    model: Alaris
    device_class: Infusion Pump
    match:
      mac_vendor: 'Alaris|CareFusion|Becton'
      dhcp_vendor_class: 'Alaris'
      hostname: '^ALARIS|ALARIS[-_ ]?(PC|8015|PUMP)'
      http_server: 'Alaris'
      http_user_agent: 'Alaris'
      snmp_sysdescr: 'Alaris'
      hl7_app: 'Alaris'
      mdns: 'alaris'
    firmware: ['Alaris\w*[/ ]v?([0-9][\w.\-]+)']

  - id: baxter-sigma-spectrum
    vendor: Baxter
    model: Sigma Spectrum
    device_class: Infusion Pump
    match:
      mac_vendor: 'Baxter'
      dhcp_vendor_class: 'Sigma\s*Spectrum|Baxter'
      hostname: 'SIGMA-?SPECTRUM|SPECTRUM-?IQ'
      hl7_app: 'Spectrum\s*IQ|Baxter'
      http_server: 'Baxter|Sigma'

  - id: icu-medical-plum
